logging:
  level:
    root: INFO
    za.co.vodacom: DEBUG
    org.hibernate.SQL: DEBUG
#    org.springframework.web: DEBUG

spring:
  config:
    activate:
      on-profile: dev # This tells Spring: "Use this file when the dev profile is active"

  cloud:
    config:
      label: develop

  datasource:
    url: jdbc:h2:mem:repoprofile;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

application:
  github:
    url: https://api.github.com/
    feignClientName: github